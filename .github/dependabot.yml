version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    open-pull-requests-limit: 5
    groups:
      # Lockstep pairs. These packages assert on each other's exact version
      # at install or at runtime, so a PR bumping one alone can never go
      # green. They are grouped ahead of everything else and carry no
      # update-types filter, so majors stay together too.
      react:
        patterns:
          - react
          - react-dom
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      # The bundler is a development dependency by classification and a
      # runtime concern by consequence: it generates the assets every visitor
      # is served, so a regression here reaches users even though vite is
      # never itself bundled. It gets the same treatment as the runtime
      # dependencies — its own PR, its own e2e run — rather than arriving
      # inside a sixteen-package lockfile diff nobody can bisect.
      bundler:
        patterns:
          - vite
          - "@vitejs/*"
      # The linters and the configs that pin them. Each config declares a
      # peerDependency on its linter's major (`@eslint/js` on `eslint ^10`,
      # `stylelint-config-standard` on `stylelint ^17`), so a PR bumping one
      # across a major without the other can never go green. Neither group
      # carries an update-types filter, and that is the point: majors are
      # exactly the case that has to move together.
      #
      # The patterns are exact names, not prefixes. `@eslint/json` and
      # `eslint-plugin-html` declare no such constraint, so they stay in the
      # batch below where the gate catches a bad bump.
      eslint:
        patterns:
          - eslint
          - "@eslint/js"
      stylelint:
        patterns:
          - stylelint
          - stylelint-config-standard
      # Dev tooling churns constantly and the gate catches breakage, so a
      # single batched PR keeps the noise down. Majors stay separate.
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Runtime dependencies are deliberately left ungrouped: they ship to the
    # browser bundle and each one deserves its own PR and e2e run.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
