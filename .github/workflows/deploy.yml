name: deploy

# Validate, then deploy, in one workflow. `validate` is the full quality gate
# (mirrors validate.sh) and is the required status check; `deploy` depends on it,
# so a red gate never ships. Deploy runs on pushes to main and manual dispatch,
# and is skipped on pull requests (where only the gate runs).
on:
  push:
    branches: [main]
    # Skip the redeploy when a push to main touches only files that cannot change
    # what the deploy puts on the server. Every push otherwise runs a full
    # `npm ci` + build + `rsync --delete` to production, even for a README typo.
    #
    # paths-ignore (a denylist) rather than paths (an allowlist), because it fails
    # SAFE: a push that also touches a deployed file still runs, so a real change
    # can never be silently dropped. An allowlist drifting behind the deploy set
    # would do exactly that — quietly stop publishing a whole class of change,
    # with nothing red to notice. The change was already linted, tested and built
    # by the pull_request trigger below before it merged.
    #
    # `pull_request` stays UNFILTERED on purpose: the gate must run on everything.
    # Skipping a deploy is cheap to get wrong in one direction only; skipping the
    # quality gate is not.
    #
    # Careful — most of what feeds this site is not itself uploaded. dist/ is a
    # build product, so src/, index.html, public/, vite.config.js and the two
    # build-time scripts are all deploy-affecting despite never being copied to
    # the host, and package.json/package-lock.json are too because our runtime
    # deps are BUNDLED into dist/. tools/check-deploy-assets.mjs binds this list
    # to that classification: every tracked file must be listed here exactly when
    # it is dev-only, so a deploy-affecting file can never be listed (which would
    # silently skip a real deploy) and a new dev-only file cannot be forgotten.
    # Keep the entries in step with tools/deploy-classification.mjs.
    paths-ignore:
      - "**.md"
      - "**.test.js"
      - "**.test.jsx"
      - ".claude/**"
      - ".github/**"
      - "e2e/**"
      - "ops/**"
      - "scripts/lib/**"
      - "src/test/**"
      - "tests/**"
      - "tools/**"
      - ".editorconfig"
      - ".env.example"
      - ".git-blame-ignore-revs"
      - ".gitignore"
      - ".markdownlint-cli2.jsonc"
      - ".mise.toml"
      - ".php-cs-fixer.dist.php"
      - ".prettierignore"
      - ".stylelintrc.json"
      - ".tool-versions"
      - "LICENSE"
      - "api/config.php.example"
      - "eslint.config.js"
      - "lychee.toml"
      - "phpunit.xml"
      - "playwright.config.js"
      - "scripts/checkGameBuild.js"
      - "scripts/checkWireLayout.js"
      - "scripts/compareSources.js"
      - "scripts/fetchIcons.js"
      - "scripts/fetchTopBuilds.js"
      - "scripts/gameBuild.json"
      - "scripts/ingestBlizzard.js"
      - "validate.sh"
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without writing (rsync --dry-run)"
        type: boolean
        default: false

# Least privilege: neither job needs to write to the repo. validate only reads
# the checkout to lint, test and build; deploy authenticates to the host over SSH
# (DEPLOY_SSH_KEY), not with the GITHUB_TOKEN. contents: read drops every other
# default scope.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read each pin with an exact first-field match and `exit` after the first
      # hit, so a malformed or hostile .tool-versions can neither prefix-match the
      # wrong tool nor emit extra GITHUB_OUTPUT lines. The values reach later
      # steps only through env vars (never interpolated into a run: script), so a
      # value can't be parsed as shell.
      - name: Read tool versions
        id: versions
        run: |
          {
            echo "php=$(awk '$1 == "php" { print $2; exit }' .tool-versions)"
            echo "shellcheck=$(awk '$1 == "shellcheck" { print $2; exit }' .tool-versions)"
            echo "shfmt=$(awk '$1 == "shfmt" { print $2; exit }' .tool-versions)"
            echo "phpcsfixer=$(awk '$1 == "php-cs-fixer" { print $2; exit }' .tool-versions)"
            echo "phpunit=$(awk '$1 == "phpunit" { print $2; exit }' .tool-versions)"
            echo "actionlint=$(awk '$1 == "actionlint" { print $2; exit }' .tool-versions)"
          } >> "$GITHUB_OUTPUT"

      # The four pinned tools come from third-party release hosts, so a fault
      # there reddens the gate on code that is perfectly fine — a 504 window on
      # GitHub's release CDN did exactly that, and --retry-all-errors below
      # rides out a blip but not an outage. Cache them under the same .tools/
      # directory and file names validate.sh keeps locally, so a normal run
      # never touches those hosts and only a pin change or a cache eviction
      # re-downloads. The key hashes the whole .tool-versions, so bumping node
      # or php re-fetches all four needlessly — that is the safe direction to
      # err in, and the alternative is four keys to keep in step by hand.
      - name: Restore the pinned tool cache
        uses: actions/cache@v6
        with:
          path: .tools
          key: pinned-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.tool-versions') }}

      # Only whatever the cache did not supply. Each fetch is skipped when the
      # file is already present, exactly as validate.sh's pinned_fetch does, so
      # a cache hit makes this step a no-op rather than a re-download.
      - name: Fetch any pinned tool the cache did not supply
        env:
          SHELLCHECK_VERSION: ${{ steps.versions.outputs.shellcheck }}
          SHFMT_VERSION: ${{ steps.versions.outputs.shfmt }}
          PHPCSFIXER_VERSION: ${{ steps.versions.outputs.phpcsfixer }}
          PHPUNIT_VERSION: ${{ steps.versions.outputs.phpunit }}
          ACTIONLINT_VERSION: ${{ steps.versions.outputs.actionlint }}
        run: |
          mkdir -p .tools
          # fetch <dest> <url> [tar-member]. --retry-all-errors covers the
          # transport faults a plain --retry ignores, notably the mid-transfer
          # "connection died" a bare retry count won't catch. Downloaded to a
          # file rather than piped into tar: a retried transfer restarts from
          # zero, but tar has already eaten the bytes from the failed attempt,
          # so the pipe would corrupt what the retry repairs.
          fetch() {
            local dest="$1" url="$2" member="${3:-}"
            [ -e "$dest" ] && return 0
            curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors "$url" -o "$RUNNER_TEMP/dl"
            if [ -n "$member" ]; then
              # `xf` with no compression flag, so the same helper handles both
              # the .tar.gz assets and the .tar.xz one (tar sniffs the format).
              tar xf "$RUNNER_TEMP/dl" -C "$RUNNER_TEMP" "$member"
              mv "$RUNNER_TEMP/$member" "$RUNNER_TEMP/dl"
            fi
            chmod +x "$RUNNER_TEMP/dl"
            mv "$RUNNER_TEMP/dl" "$dest"
          }
          fetch ".tools/shellcheck-${SHELLCHECK_VERSION}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          fetch ".tools/shfmt-${SHFMT_VERSION}" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          fetch ".tools/php-cs-fixer-${PHPCSFIXER_VERSION}.phar" \
            "https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/download/v${PHPCSFIXER_VERSION}/php-cs-fixer.phar"
          fetch ".tools/phpunit-${PHPUNIT_VERSION}.phar" \
            "https://phar.phpunit.de/phpunit-${PHPUNIT_VERSION}.phar"
          fetch ".tools/actionlint-${ACTIONLINT_VERSION}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint

      # Both tools come from .tools/ at their pinned versions, never from the
      # runner image: an image bump would otherwise move shellcheck under us and
      # redden or green the gate on unchanged code.
      - name: Shell scripts (shellcheck + shfmt)
        env:
          SHELLCHECK_VERSION: ${{ steps.versions.outputs.shellcheck }}
          SHFMT_VERSION: ${{ steps.versions.outputs.shfmt }}
        run: |
          mapfile -t sh_files < <(git ls-files '*.sh')
          ".tools/shellcheck-${SHELLCHECK_VERSION}" "${sh_files[@]}"
          ".tools/shfmt-${SHFMT_VERSION}" -d "${sh_files[@]}"

      # The runner's default PHP (8.3) is older than PHPUnit 13 needs (>= 8.4.1),
      # so pin it. This also makes php-cs-fixer and php -l run on a fixed version.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.versions.outputs.php }}

      - name: PHP (syntax, format, tests)
        env:
          PHPCSFIXER_VERSION: ${{ steps.versions.outputs.phpcsfixer }}
          PHPUNIT_VERSION: ${{ steps.versions.outputs.phpunit }}
        run: |
          for f in $(git ls-files '*.php' '*.php.example'); do php -l "$f"; done
          php ".tools/php-cs-fixer-${PHPCSFIXER_VERSION}.phar" fix --dry-run --config .php-cs-fixer.dist.php
          php ".tools/phpunit-${PHPUNIT_VERSION}.phar"

      - name: Workflows (actionlint)
        env:
          ACTIONLINT_VERSION: ${{ steps.versions.outputs.actionlint }}
        run: |
          ".tools/actionlint-${ACTIONLINT_VERSION}"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint Markdown
        run: npm run lint:md

      # svgo keeps every tracked SVG optimised; the check fails if any would
      # change. Discover them with git ls-files (like the shell-lint step) so a
      # newly added SVG is checked too. Write to a temp file rather than piping,
      # so a svgo crash (bad fetch, config error) is distinguished from a
      # genuinely unoptimised SVG instead of pipefail turning both into the same
      # misleading message. Mirrors validate.sh.
      - name: Check SVG (svgo)
        run: |
          out="$RUNNER_TEMP/svgo-out.svg"
          mapfile -t svg_files < <(git ls-files '*.svg')
          for f in "${svg_files[@]}"; do
            if ! npx svgo -i "$f" -o "$out" >/dev/null; then
              echo "svgo failed to process $f"
              exit 1
            fi
            if ! diff -q "$out" "$f" >/dev/null; then
              echo "$f is not optimised; run: npx svgo $f"
              exit 1
            fi
          done

      - name: Run tests with coverage thresholds
        run: npm run coverage

      # The mirrored tools/shared/ bundle is stdlib-only (node:test), which
      # vitest cannot collect, so its tests are excluded from the vitest include
      # and run here under Node's own runner instead.
      - name: Run the shared bundle tests
        run: npm run test:shared

      - name: Build
        run: npm run build

      # Verify the CSP hash for the inline anti-flash theme script still matches
      # the built script's bytes — runs against dist/ so it checks what ships —
      # that deploy.sh still stages every api/ file the server needs, and that
      # the mirrored tools/shared/ bundle still matches its manifest.
      - name: Check CSP, og-image, asset refs and deploy set
        run: |
          npm run check:csp
          npm run check:og
          npm run check:asset-refs
          npm run check:deploy-assets
          npm run check:shared

      # Well-formedness check on the generated sitemap — catches a templating bug
      # in prerenderSpecs before deploy. xmllint isn't on the runner image by
      # default, so install libxml2-utils first.
      - name: Validate sitemap (xmllint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout dist/sitemap.xml

      # The Nu Html Checker needs a JVM. Set it up here (after the Node steps that
      # do the real work) so the vnu step below can run the jar.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Validate the built markup against dist/ — the entry page plus every
      # prerendered spec landing page, and the SVG favicon — so a markup or
      # prerender-template bug is caught before deploy. Mirrors validate.sh. The
      # jar comes from the `vnu-jar` devDependency, so package-lock.json pins the
      # exact bytes: upstream publishes only a rolling `latest` release with no
      # versioned jar URL, so downloading from GitHub would silently change the
      # validator under us between two runs on identical code. Two benign infos
      # are filtered: the void-element trailing slash (Vite/Prettier house style) and
      # the CSP meta check (a file:// false positive where script-src 'self' plus
      # the inline-script hashes can't resolve without an origin; over https the
      # policy allows them, verified in-browser). The generated Tailwind CSS is not
      # checked — vnu rejects modern properties it doesn't yet recognise.
      - name: Validate built HTML + SVG (vnu)
        run: |
          mapfile -t html_files < <(find dist -name '*.html')
          java -jar node_modules/vnu-jar/build/dist/vnu.jar \
            --filterpattern '.*(Trailing slash on void elements|Content Security Policy).*' \
            --also-check-svg "${html_files[@]}" dist/favicon.svg

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Serialize deploys: never let two runs rsync to the host at once. Queue
    # rather than cancel so an in-flight deploy always finishes cleanly.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Full history so prerenderSpecs can derive each sitemap URL's <lastmod>
      # from the last commit that touched its source data (shallow returns none).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".tool-versions"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/comparebuilds_deploy
          chmod 600 ~/.ssh/comparebuilds_deploy

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Pin the dedicated key to the host and forbid any other identity, so
          # the agent/default keys can't interfere with auth.
          {
            echo "Host http2.core-networks.de"
            echo "  HostName http2.core-networks.de"
            echo "  User web4186"
            echo "  IdentityFile ~/.ssh/comparebuilds_deploy"
            echo "  IdentitiesOnly yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy
        run: ./deploy.sh ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
