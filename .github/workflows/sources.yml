name: sources

# The data freshness check lives in its own workflow ON PURPOSE: the deploy
# workflow's `validate` gate is what blocks a release, and this check fetches
# Blizzard (Game Data API + wago.tools DB2) live — a momentary outage or an
# upstream shape change must never block deploy. It runs compareSources.js, which
# re-derives the data from Blizzard and diffs it against the committed src/data:
# HARD divergences (build-string wire layout, ranks, gates, prereqs) fail the job;
# SOFT differences (positions, names, descriptions, per-spec membership) are
# reported only.
#
# The weekly schedule catches the committed data drifting from a new game patch;
# the PR trigger catches a data change that breaks parity. A red run here is a
# signal to investigate, not a blocked release. It needs the BLIZZARD_CLIENT_ID/
# SECRET repo secrets and is skipped on fork PRs (which don't receive secrets).
on:
  pull_request:
    paths:
      - "scripts/ingestBlizzard.js"
      - "scripts/compareSources.js"
      - "scripts/checkWireLayout.js"
      - "scripts/checkGameBuild.js"
      - "scripts/gameBuild.json"
      - "scripts/lib/**"
      - "src/data/**"
      - "src/lib/wireLayout.snapshot.json"
  workflow_dispatch:
  schedule:
    # Weekly: the full run, including the credentialed compareSources job.
    - cron: "0 7 * * 1"
    # Daily: the cheap credential-free probe only. The `upstream` job costs two
    # small public GETs and a few megabytes, so it can ask "has the game moved?"
    # every morning; compareSources re-derives every class against a rate-limited
    # API and stays weekly. The `compare` job below opts out of this cron.
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    # Skipped on the daily cron — that one exists for the cheap `upstream` job.
    # Guarding the job (not the step) keeps the daily run from spending an
    # otherwise-idle runner and a Blizzard token on a full re-derivation.
    if: ${{ github.event.schedule != '0 6 * * *' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".tool-versions"
          cache: npm

      # compareSources.js pulls in the app's ingest chain, which reaches
      # sanitizeDescription.js -> dompurify, so the node_modules must be present
      # or the run dies with ERR_MODULE_NOT_FOUND before any comparison.
      - name: Install dependencies
        run: npm ci

      - name: Compare fresh Blizzard ingest against committed data
        # Skipped on fork PRs, which don't receive secrets (the auth would fail).
        # Descriptions aren't fetched — a soft field (no build-string impact) that
        # would add thousands of requests per run.
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: node scripts/compareSources.js

  # The credential-free half of the freshness checks. compareSources needs
  # the Blizzard secrets, so it is skipped entirely on fork PRs; this one is a
  # plain public GET and therefore runs everywhere, including forks. It confirms
  # only the build-string node ordering, but against an INDEPENDENT derivation of
  # the game client (Raidbots, via SimC's casc/dbc tools) rather than against our
  # own committed snapshot — plus a cheap probe of which build each channel is on.
  # See scripts/checkWireLayout.js and scripts/checkGameBuild.js.
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".tool-versions"
          cache: npm

      # No `npm ci`: both scripts import only node builtins and local files
      # (src/lib/buildString.js pulls in nothing else), so they run straight from
      # the checkout.

      # Raidbots asks callers to cache their files locally, and a fresh runner
      # has no disk cache at all — without this the job re-pulls ~3 MB per
      # channel on every run. The cache directory is keyed by content hash
      # internally, so restoring a stale one is safe: a new upload changes the
      # hash and misses it.
      - name: Restore the Raidbots file cache
        uses: actions/cache@v4
        with:
          path: scripts/.cache/raidbots
          key: raidbots-${{ github.run_id }}
          restore-keys: raidbots-

      # Cheap probe first — a ~1 KB metadata.json per channel. It fails when live
      # has moved past the acknowledged patch version.
      - name: Probe the live game build
        run: node scripts/checkGameBuild.js

      # Every later step runs even when the probe above failed: a moved build is
      # exactly when the layout answer matters most, so it must not be hidden by
      # the thing that prompted the question.
      - name: Confirm the live wire layout against Raidbots
        if: ${{ !cancelled() }}
        run: node scripts/checkWireLayout.js

      # The test channels carry whatever build they are currently on, which is
      # not always AHEAD of live — between patches a channel can sit on an older
      # build, in which case a divergence says nothing about committed data. So
      # these steps are informational and always exit zero (the script warns
      # instead of failing off-live). Their value is the case where a channel IS
      # ahead: a wire-layout break becomes advance notice rather than a
      # post-patch incident.
      - name: Look ahead at the test channels
        if: ${{ !cancelled() }}
        run: |
          node scripts/checkWireLayout.js --env=ptr
          node scripts/checkWireLayout.js --env=beta
