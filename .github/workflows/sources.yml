name: sources

# The data freshness check lives in its own workflow ON PURPOSE: the deploy
# workflow's `validate` gate is what blocks a release, and this check fetches
# Blizzard (Game Data API + wago.tools DB2) live — a momentary outage or an
# upstream shape change must never block deploy. It runs compareSources.js, which
# re-derives the data from Blizzard and diffs it against the committed src/data:
# HARD divergences (build-string wire layout, ranks, gates, prereqs) fail the job;
# SOFT differences (positions, names, descriptions, per-spec membership) are
# reported only.
#
# The weekly schedule catches the committed data drifting from a new game patch;
# the PR trigger catches a data change that breaks parity. The weekly run also
# refreshes src/data/topBuilds.json and proposes the result as a pull request —
# the one job here that writes anything. A red run here is a
# signal to investigate, not a blocked release. It needs the BLIZZARD_CLIENT_ID/
# SECRET repo secrets and is skipped on fork PRs (which don't receive secrets).
on:
  pull_request:
    paths:
      - "scripts/ingestBlizzard.js"
      - "scripts/compareSources.js"
      - "scripts/checkWireLayout.js"
      - "scripts/checkGameBuild.js"
      - "scripts/gameBuild.json"
      - "scripts/fetchTopBuilds.js"
      - "scripts/lib/**"
      - "src/data/**"
      - "src/lib/wireLayout.snapshot.json"
  workflow_dispatch:
  schedule:
    # Weekly: the full run, including the credentialed compareSources job.
    - cron: "0 7 * * 1"
    # Daily: the cheap credential-free probe only. The `upstream` job costs two
    # small public GETs and a few megabytes, so it can ask "has the game moved?"
    # every morning; compareSources re-derives every class against a rate-limited
    # API and stays weekly. The `compare` job below opts out of this cron.
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    # Skipped on the daily cron — that one exists for the cheap `upstream` job.
    # Guarding the job (not the step) keeps the daily run from spending an
    # otherwise-idle runner and a Blizzard token on a full re-derivation.
    if: ${{ github.event.schedule != '0 6 * * *' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".tool-versions"
          cache: npm

      # compareSources.js pulls in the app's ingest chain, which reaches
      # sanitizeDescription.js -> dompurify, so the node_modules must be present
      # or the run dies with ERR_MODULE_NOT_FOUND before any comparison.
      - name: Install dependencies
        run: npm ci

      - name: Compare fresh Blizzard ingest against committed data
        # Skipped on fork PRs, which don't receive secrets (the auth would fail).
        # Descriptions aren't fetched — a soft field (no build-string impact) that
        # would add thousands of requests per run.
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: node scripts/compareSources.js

  # The credential-free half of the freshness checks. compareSources needs
  # the Blizzard secrets, so it is skipped entirely on fork PRs; this one is a
  # plain public GET and therefore runs everywhere, including forks. It confirms
  # only the build-string node ordering, but against an INDEPENDENT derivation of
  # the game client (Raidbots, via SimC's casc/dbc tools) rather than against our
  # own committed snapshot — plus a cheap probe of which build each channel is on.
  # See scripts/checkWireLayout.js and scripts/checkGameBuild.js.
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".tool-versions"
          cache: npm

      # No `npm ci`: both scripts import only node builtins and local files
      # (src/lib/buildString.js pulls in nothing else), so they run straight from
      # the checkout.

      # Raidbots asks callers to cache their files locally, and a fresh runner
      # has no disk cache at all — without this the job re-pulls ~3 MB per
      # channel on every run. The cache directory is keyed by content hash
      # internally, so restoring a stale one is safe: a new upload changes the
      # hash and misses it.
      - name: Restore the Raidbots file cache
        uses: actions/cache@v4
        with:
          path: scripts/.cache/raidbots
          key: raidbots-${{ github.run_id }}
          restore-keys: raidbots-

      # Cheap probe first — a ~1 KB metadata.json per channel. It fails when live
      # has moved past the acknowledged patch version.
      - name: Probe the live game build
        run: node scripts/checkGameBuild.js

      # Every later step runs even when the probe above failed: a moved build is
      # exactly when the layout answer matters most, so it must not be hidden by
      # the thing that prompted the question.
      - name: Confirm the live wire layout against Raidbots
        if: ${{ !cancelled() }}
        run: node scripts/checkWireLayout.js

      # The test channels carry whatever build they are currently on, which is
      # not always AHEAD of live — between patches a channel can sit on an older
      # build, in which case a divergence says nothing about committed data. So
      # these steps are informational and always exit zero (the script warns
      # instead of failing off-live). Their value is the case where a channel IS
      # ahead: a wire-layout break becomes advance notice rather than a
      # post-patch incident.
      - name: Look ahead at the test channels
        if: ${{ !cancelled() }}
        run: |
          node scripts/checkWireLayout.js --env=ptr
          node scripts/checkWireLayout.js --env=beta

  # Keeps src/data/topBuilds.json from going stale. The table is a dated snapshot
  # of Raidbots' top sims that the app ships to users, and nothing else would
  # ever prompt a refresh — a generated file with no owner quietly rots.
  #
  # Weekly, not daily, and on the same cron as the full compare: the underlying
  # sample is a rolling 30-day window, so its counts drift a little every day
  # while the builds it recommends move far more slowly. A daily refresh would
  # trade a stale file for a stream of near-identical pull requests.
  #
  # Opens a PR rather than pushing to main. The file is app data — a bad refresh
  # ships broken build strings to every user — so a human confirms it, and the
  # diff itself is the most readable summary of what moved upstream.
  top-builds:
    runs-on: ubuntu-latest
    # No GITHUB_TOKEN write scope at all: every write this job makes (the branch
    # push and the PR) is authenticated with TOP_BUILDS_PAT, a fine-grained token
    # scoped to this repository with `contents: write` + `pull requests: write`.
    # That is deliberate over the repo-wide "Allow GitHub Actions to create and
    # approve pull requests" toggle, which would also let any workflow here
    # APPROVE a pull request. The PAT has no approval power on its own PRs.
    permissions:
      contents: read
    # Never on a pull_request trigger: a PR from a fork would run with the PAT in
    # scope on this repository.
    if: ${{ github.event_name != 'pull_request' && github.event.schedule != '0 6 * * *' }}
    steps:
      # Check the token before doing any work, so a missing or expired secret
      # fails with this sentence rather than an opaque 403 from git or gh.
      - name: Require the refresh token
        env:
          TOP_BUILDS_PAT: ${{ secrets.TOP_BUILDS_PAT }}
        run: |
          if [ -z "$TOP_BUILDS_PAT" ]; then
            echo "::error::TOP_BUILDS_PAT is not set. Create a fine-grained PAT" \
              "scoped to this repository with contents:write and" \
              "pull-requests:write, and add it as a repository secret."
            exit 1
          fi

      # Checking out WITH the PAT persists it as the credential for the later
      # push, so the branch is pushed by the token's identity too. A branch
      # pushed by GITHUB_TOKEN would not raise `synchronize` events, so the
      # `validate` gate would run on the PR's first commit and then go quiet for
      # every weekly force-push after it.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.TOP_BUILDS_PAT }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".tool-versions"
          cache: npm

      # Unlike the checks above this one needs node_modules: it runs the test
      # suite over the regenerated table before proposing it.
      - name: Install dependencies
        run: npm ci

      - name: Regenerate the top-sims table
        run: node scripts/fetchTopBuilds.js --write

      - name: Stop here when nothing moved upstream
        id: changed
        run: |
          if git diff --quiet -- src/data/topBuilds.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "No change in the top-sims table."
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      # The safety property of the whole feature: every shipped string must
      # decode against the committed class data, or the app renders a broken
      # slot the user cannot act on. `validate` re-runs this on the PR (the PAT's
      # identity triggers workflows, unlike GITHUB_TOKEN), so this step is no
      # longer the only gate — it is the fast one, failing before a branch is
      # pushed and a PR opened over a table that cannot decode.
      - name: Verify every regenerated build string still decodes
        if: steps.changed.outputs.changed == 'true'
        run: npx vitest run scripts/fetchTopBuilds.test.js

      - name: Open or update the refresh PR
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TOP_BUILDS_PAT }}
        run: |
          set -euo pipefail
          branch=chore/top-builds-refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One reusable branch, force-pushed. A weekly job that opened a fresh
          # branch each time would leave a drift of stale PRs behind it. The
          # trade-off is that this branch is not a place to add commits: the
          # next run overwrites it. Take the refresh, or close it.
          git checkout -B "$branch"
          git add src/data/topBuilds.json
          git commit -m "chore(data): refresh the top-sims reference builds"
          git push --force origin "$branch"

          if gh pr list --head "$branch" --state open --json number --jq '.[].number' | grep -q .; then
            echo "Existing PR updated by the force-push."
            exit 0
          fi

          # Written to a file rather than a variable: a quoted heredoc inside a
          # $(...) substitution fails to parse in bash once the text contains an
          # apostrophe, and this body has one.
          cat >/tmp/pr-body.md <<'MARKDOWN'
          Automated weekly refresh of `src/data/topBuilds.json` from
          [Raidbots' top-sims summary](https://www.raidbots.com/developers).

          Every build string in this table was re-decoded against the committed
          class data before this PR was opened, and the `validate` gate runs on
          this PR as it would on any other.

          Reviewing: skim the diff for plausibility. A whole spec emptying out,
          or every entry changing at once, points at something moving upstream
          rather than at the sims themselves.
          MARKDOWN

          gh pr create --head "$branch" --base main \
            --title "chore(data): refresh the top-sims reference builds" \
            --body-file /tmp/pr-body.md
